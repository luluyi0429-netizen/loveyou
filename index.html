<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d; /* 纯黑背景，与粉色形成强烈对比 */
            height: 100vh;
            display: flex;
            flex-direction: column; /* 改为纵向排列，方便放置签名 */
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; /* 防止出现滚动条 */
        }

        .container {
            text-align: center;
        }

        .love-text {
            font-size: 8vw; /* 文字大小会根据屏幕宽度自适应 */
            font-weight: 400;
            letter-spacing: 0.2em;
            margin-bottom: 24px;
            
            /* 粉色渐变与发光效果 */
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            color: transparent;
            
            /* 入场动画：透明度渐变与向上微移 */
            animation: fadeIn 1.5s ease-out forwards, pulse 2.5s infinite alternate 1.5s;
            opacity: 0; /* 初始状态透明度为0 */
        }

        .signature {
            font-size: 1.5vw;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.1em;
            
            /* 签名淡入动画，比主文字稍微延迟出现 */
            animation: fadeIn 2s ease-out forwards;
            opacity: 0;
            animation-delay: 1s; /* 延迟1秒显示 */
        }

        /* 主文字入场动画 */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px); /* 向下偏移 */
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 呼吸发光动画 */
        @keyframes pulse {
            0% {
                text-shadow: 0 0 10px rgba(255, 117, 140, 0.4);
                transform: scale(1);
            }
            100% {
                text-shadow: 0 0 40px rgba(255, 126, 179, 0.8);
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="love-text">
            LOVE YOU
        </div>
        <div class="signature">
            - from Luluyi
        </div>
    </div>
</body>
</html>
