<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You - Luluyi's Player</title>
    <style>
        /* 基础样式复位 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            /* 采用暗青色/青蓝色背景 */
            background-color: #2b6a71; 
            background: linear-gradient(135deg, #2b6a71 0%, #1e5a60 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; /* 防止出现滚动条 */
            color: #ffffff;
        }

        /* 主体内容容器 */
        .main-container {
            width: 95%;
            max-width: 1400px;
            height: 70vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3%;
            position: relative;
        }

        /* --- 左侧：唱片组合样式 --- */
        .player-left {
            flex: 0 0 auto;
            position: relative;
            width: 45vw; 
            max-width: 650px;
            height: 40vw; 
            max-height: 550px;
            display: flex;
            justify-content: flex-start; /* 整体靠左 */
            align-items: center;
            padding-right: 15%; 
        }

        /* 1. 后方：圆形光盘 - 核心修改：进一步缩小并固定为绝对正圆 */
        .cd-box {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            /* 将光盘中心向右微调，露出部分更自然 */
            left: 28%; 
            /* 【尺寸微调】将光盘宽度从 70% 缩小至 58%，达到合适大小 */
            width: 58%; 
            z-index: 1; /* 在方形封面下方 */
        }

        .cd-disc {
            width: 100%;
            height: 0;
            padding-bottom: 100%; /* 形成绝对的正圆 */
            border-radius: 50%;
            background-color: #080808; 
            border: 10px solid rgba(15, 15, 15, 1);
            box-shadow: 10px 0 25px rgba(0, 0, 0, 0.5); 
            position: relative; 
            
            animation: rotateDisk 18s linear infinite;
            animation-play-state: paused; /* 默认暂停 */
        }

        /* 唱片中间的小孔与金属环 */
        .cd-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 22%;
            height: 22%;
            background: radial-gradient(circle, #ddd 0%, #aaa 40%, rgba(200,200,200,0.8) 100%);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.4);
            z-index: 2;
        }
        
        /* 唱片纹理遮罩 */
        .cd-disc::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(
                rgba(255,255,255,0.02) 0,
                rgba(255,255,255,0.02) 1px,
                rgba(0,0,0,0) 2px,
                rgba(0,0,0,0) 4px
            );
            pointer-events: none;
        }

        /* 2. 前方：固定的方形专辑封面 */
        .album-cover {
            position: relative;
            width: 80%; 
            padding-bottom: 80%; 
            height: 0;
            background: url('ComfyUI_04383_.png') no-repeat center center / cover;
            border-radius: 8px; 
            box-shadow: 8px 8px 30px rgba(0, 0, 0, 0.6);
            z-index: 3; 
            pointer-events: none; /* 让点击能穿透到下方的覆盖层 */
        }

        /* --- 右侧：文字部分 --- */
        .player-right {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end; 
            padding-left: 50px;
            text-align: right;
            position: relative;
        }

        .love-text {
            font-size: 6vw; 
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 24px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
            
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            color: transparent;
            
            animation: pulse 2.5s infinite alternate;
        }

        .signature {
            font-size: 1.8vw;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.6);
            animation: fadeInRight 1.5s ease-out forwards;
            opacity: 0;
            animation-delay: 1.5s;
        }

        /* --- 下方：自定义播放控制条 --- */
        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 10%;
            z-index: 10;
        }

        .progress-container {
            flex: 1;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 0 30px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background-color: #ff7eb3; 
            width: 0%;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .control-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
            transition: color 0.2s, transform 0.1s;
        }

        .control-btn:hover {
            color: #ff7eb3;
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        /* --- 动画 --- */
        @keyframes rotateDisk {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% {
                text-shadow: 0 0 10px rgba(255, 117, 140, 0.3);
                transform: scale(1);
            }
            100% {
                text-shadow: 0 0 40px rgba(255, 126, 179, 0.7);
                transform: scale(1.01);
            }
        }

        @keyframes fadeInRight {
            0% {
                opacity: 0;
                transform: translateX(20px); 
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        #play-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; color: #fff; cursor: pointer;
            font-size: 2vw; letter-spacing: 0.1em;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div id="play-overlay">
        Click to Start the Romance
    </div>

    <div class="main-container">
        
        <div class="player-left">
            <div class="cd-box">
                <div class="cd-disc" id="cdDisc">
                    <div class="cd-center"></div>
                </div>
            </div>
            <div class="album-cover"></div>
        </div>

        <div class="player-right">
            <div class="love-text">
                LOVE YOU
            </div>
            <div class="signature">
                - from Luluyi
            </div>
        </div>

    </div>

    <div class="player-controls">
        <button class="control-btn" id="playPauseBtn">▶</button> 
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <audio id="bgMusic" src="5月5日.MP3" loop></audio>

    <script>
        const playOverlay = document.getElementById('play-overlay');
        const music = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const cdDisc = document.getElementById('cdDisc');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        playOverlay.addEventListener('click', function() {
            music.play();
            updatePlayState(true);
            playOverlay.style.display = 'none'; 
        });

        playPauseBtn.addEventListener('click', function() {
            if (music.paused) {
                music.play();
                updatePlayState(true);
            } else {
                music.pause();
                updatePlayState(false);
            }
        });

        progressContainer.addEventListener('click', function(e) {
            const width = this.clientWidth; 
            const clickX = e.offsetX; 
            const duration = music.duration; 

            if (duration) {
                music.currentTime = (clickX / width) * duration;
            }
        });

        music.addEventListener('timeupdate', function() {
            const duration = music.duration;
            const currentTime = music.currentTime;
            
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
            }
        });

        function updatePlayState(isPlaying) {
            if (isPlaying) {
                playPauseBtn.innerHTML = '❚❚'; 
                cdDisc.style.animationPlayState = 'running'; 
            } else {
                playPauseBtn.innerHTML = '▶'; 
                cdDisc.style.animationPlayState = 'paused'; 
            }
        }
    </script>
</body>
</html>
